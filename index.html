              <div className="grid grid-cols-2 gap-1.5 p-1 bg-[#E2DDD4] rounded-xl mb-5 border border-[#D5CFC4]">
                <button onClick={() => setShowSavedOnly(false)} className={`py-2 px-3 rounded-lg text-xs font-bold ${!showSavedOnly ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]/70'}`}>🔥 실시간 트렌드</button>
                <button onClick={() => setShowSavedOnly(true)} className={`py-2 px-3 rounded-lg text-xs font-bold ${showSavedOnly ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]/70'}`}>📌 저장함 ({savedIds.length})</button>
              </div>

              <div className="mb-5">
                <span className="text-[11px] font-bold uppercase tracking-wider text-[#866143] px-2 block mb-2">6대 바이럴 · 검색 채널</span>
                <nav className="space-y-1">
                  {CHANNELS.map((ch) => (
                    <button key={ch.id} onClick={() => { setSelectedChannel(ch.id); setShowSavedOnly(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center justify-between ${selectedChannel === ch.id && !showSavedOnly ? 'bg-[#866143] text-[#F2F1ED]' : 'hover:bg-[#E2DDD4] text-[#292824]/80'}`}>
                      <div className="truncate pr-2">
                        <div className="text-xs font-bold truncate">{ch.name}</div>
                        <div className="text-[10px] opacity-75 truncate">{ch.sub}</div>
                      </div>
                      <span className="text-[9px] font-bold px-1.5 py-0.5 rounded bg-[#F2F1ED] text-[#866143]">{ch.badge}</span>
                    </button>
                  ))}
                </nav>
              </div>

              <div>
                <span className="text-[11px] font-bold uppercase tracking-wider text-[#866143] px-2 block mb-2">4대 커머스 · 앱 시장조사</span>
                <nav className="space-y-1">
                  {CATEGORIES.map((cat) => (
                    <button key={cat.id} onClick={() => { setSelectedCategory(cat.id); setShowSavedOnly(false); }} className={`w-full text-left px-3 py-2 rounded-xl flex items-center justify-between ${selectedCategory === cat.id && !showSavedOnly ? 'bg-[#292824] text-[#F2F1ED]' : 'hover:bg-[#E2DDD4] text-[#292824]/80'}`}>
                      <div>
                        <div className="text-xs font-bold">{cat.name}</div>
                        <div className="text-[10px] opacity-70">{cat.sub}</div>
                      </div>
                      <span className="text-xs font-bold">›</span>
                    </button>
                  ))}
                </nav>
              </div>
            </div>

            <div className="p-4 m-4 rounded-2xl bg-[#F2F1ED] border border-[#866143]">
              <div className="text-xs font-extrabold text-[#866143] mb-1">● 실시간 API 파이프라인</div>
              <div className="text-[10px] text-[#292824]/80 mb-2 font-medium">{lastSyncTime}</div>
              <button
                onClick={() => runLiveMarketResearch(liveInput || '저분자 콜라겐 팩')}
                disabled={isSyncing}
                className="w-full py-2.5 px-3 rounded-xl bg-[#866143] text-xs font-extrabold text-[#F2F1ED] hover:opacity-90 transition-all"
              >
                {isSyncing ? '🚀 실시간 수집·분석 중...' : '↻ 즉시 실시간 동기화 실행'}
              </button>
            </div>
          </aside>

          {/* 우측 메인 */}
          <div className="flex-1 flex flex-col min-w-0">
            {/* 상단 실시간 AI 시장조사 생성 바 */}
            <header className="sticky top-14 lg:top-0 z-20 bg-[#F2F1ED]/95 backdrop-blur-md border-b border-[#DEDAD2] px-4 lg:px-6 py-4">
              <div className="p-3.5 rounded-2xl bg-[#EAE6DF] border-2 border-[#866143] mb-3">
                <div className="flex items-center justify-between mb-2">
                  <span className="text-xs font-extrabold text-[#866143]">⚡ 실시간 네이버 쇼핑 & Gemini AI 시장조사 생성기</span>
                  <span className="text-[11px] font-bold text-[#292824]/70">{apiStatusMsg}</span>
                </div>
                <form
                  onSubmit={(e) => {
                    e.preventDefault();
                    runLiveMarketResearch(liveInput);
                  }}
                  className="flex flex-col sm:flex-row gap-2"
                >
                  <input
                    type="text"
                    value={liveInput}
                    onChange={(e) => setLiveInput(e.target.value)}
                    placeholder="분석할 상품/키워드를 입력하고 엔터를 치세요! (예: 레티놀 앰플, 단백질 쉐이크, 무소음 마우스)"
                    className="flex-1 bg-[#F2F1ED] border border-[#D5CFC4] focus:border-[#866143] rounded-xl px-4 py-2.5 text-sm font-bold text-[#292824] placeholder-[#292824]/45 focus:outline-none"
                  />
                  <button
                    type="submit"
                    disabled={isSyncing}
                    className="px-5 py-2.5 rounded-xl bg-[#866143] text-[#F2F1ED] text-xs font-extrabold shrink-0 hover:bg-[#292824] transition-all"
                  >
                    {isSyncing ? 'AI가 실시간 분석 중 (3초)...' : '🔍 실시간 AI 시장조사 실행'}
                  </button>
                </form>
              </div>

              <div className="flex items-center justify-between gap-2">
                <input
                  type="text"
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  placeholder="아래 생성된 카드 내 검색 필터..."
                  className="w-full max-w-xs bg-[#EAE6DF] border border-[#D5CFC4] rounded-xl px-3 py-1.5 text-xs text-[#292824]"
                />
                <span className="text-[11px] font-bold text-[#866143]">키워드를 클릭해도 실시간 AI 분석이 바로 실행됩니다 ▼</span>
              </div>
            </header>

            {/* 실시간 급상승 매트릭스 (클릭 시 해당 키워드로 실제 API 즉시 호출!) */}
            <section className="px-4 lg:px-6 pt-5">
              <div className="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-3">
                {INITIAL_MATRIX.map((box) => (
                  <div key={box.channelId} className="p-3.5 rounded-2xl border border-[#D5CFC4] bg-[#EAE6DF]/80">
                    <div className="flex items-center justify-between mb-2 pb-1.5 border-b border-[#D5CFC4]">
                      <span className="text-xs font-extrabold text-[#292824]">{box.channelName}</span>
                      <span className="text-[10px] font-bold text-[#866143]">{box.badgeText}</span>
                    </div>
                    <div className="space-y-1">
                      {box.keywords.map((kw) => (
                        <button
                          key={kw.rank}
                          onClick={() => {
                            setLiveInput(kw.word);
                            runLiveMarketResearch(kw.word);
                          }}
                          className="w-full flex items-center justify-between px-2 py-1.5 rounded-lg hover:bg-[#866143] hover:text-[#F2F1ED] text-left group transition-all"
                        >
                          <span className="text-xs font-bold truncate">{kw.rank}. {kw.word}</span>
                          <span className="text-[10px] font-extrabold text-[#866143] group-hover:text-[#F2F1ED] shrink-0 ml-2">LIVE 분석 ›</span>
                        </button>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </section>

            {/* 카드 그리드 */}
            <main className="p-4 lg:p-6 flex-1">
              <div className="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-5">
                {filteredReferences.map((item) => {
                  const isSaved = savedIds.includes(item.id);
                  return (
                    <article
                      key={item.id}
                      onClick={() => { setActiveRef(item); setActiveTab('market'); }}
                      className={`bg-[#EAE6DF] border-2 ${item.isLiveGenerated ? 'border-[#866143]' : 'border-[#D5CFC4]'} hover:border-[#292824] rounded-2xl overflow-hidden flex flex-col justify-between transition-all hover:-translate-y-1 cursor-pointer`}
                    >
                      <div>
                        <div className="p-4 bg-[#E2DDD4] flex flex-col justify-between border-b border-[#D5CFC4] min-h-[175px]">
                          <div className="flex items-center justify-between">
                            <div className="flex items-center gap-1.5">
                              {item.isLiveGenerated && (
                                <span className="px-2 py-0.5 rounded bg-[#292824] text-[#F2F1ED] text-[10px] font-extrabold">⚡ LIVE 생성</span>
                              )}
                              <span className="px-2.5 py-1 rounded-lg bg-[#F2F1ED] text-[11px] font-bold text-[#292824] border border-[#D5CFC4]">{item.categoryLabel}</span>
                              <span className="px-2 py-1 rounded-lg bg-[#866143] text-[#F2F1ED] text-[11px] font-extrabold">{item.growth} ▲</span>
                            </div>
                            <button onClick={(e) => toggleSave(e, item.id)} className="px-2.5 py-1 rounded-lg text-xs font-bold border bg-[#F2F1ED] text-[#292824] border-[#D5CFC4]">
                              {isSaved ? '저장됨' : '저장'}
                            </button>
                          </div>
                          <div className="my-3">
                            <div className="text-[11px] font-extrabold text-[#866143] mb-1">{item.memeTag}</div>
                            <h3 className="text-sm font-extrabold text-[#292824] leading-snug">{item.thumbnailTitle}</h3>
                          </div>
                          <div className="flex items-center justify-between text-[11px] pt-2 border-t border-[#D5CFC4]">
                            <span className="font-bold text-[#866143]">{item.platformSource}</span>
                            <span className="font-mono text-[10px] text-[#292824] font-bold">{item.format}</span>
                          </div>
                        </div>
                        <div className="p-4">
                          <div className="flex justify-between text-[11px] text-[#866143] font-semibold mb-1">
                            <span>분석 키워드</span>
                            <span className="font-bold text-[#292824]">블루오션 {item.blueOceanScore}점</span>
                          </div>
                          <div className="text-base font-extrabold text-[#292824] mb-3">{item.keyword}</div>
                          <div className="p-3 rounded-xl bg-[#F2F1ED] border border-[#D5CFC4] space-y-1.5">
                            <div className="flex justify-between text-xs">
                              <span className="text-[#866143] font-bold">1위 매칭 상품</span>
                              <span className="font-bold text-[#292824] truncate max-w-[180px]">{item.rankings?.[0]?.name}</span>
                            </div>
                            <div className="pt-1.5 border-t border-[#DEDAD2] text-xs">
                              <span className="text-[10px] font-bold text-[#866143] block">소비자 불만 1위 (빈틈 기회)</span>
                              <span className="text-[#292824] font-medium line-clamp-1">“{item.vocPainPoints?.[0]?.issue}”</span>
                            </div>
                          </div>
                        </div>
                      </div>
                      <div className="px-4 py-2.5 bg-[#E2DDD4]/60 border-t border-[#D5CFC4] flex justify-between items-center text-xs">
                        <span className="text-[#292824]/80 truncate">{item.rankings?.[0]?.price || '실시간 최저가'}</span>
                        <span className="font-extrabold text-[#866143] shrink-0">실시간 리포트 열기 ›</span>
                      </div>
                    </article>
                  );
                })}
              </div>
            </main>
          </div>

          {/* 상세 리포트 모달 */}
          {activeRef && (
            <div onClick={() => setActiveRef(null)} className="fixed inset-0 z-50 bg-[#292824]/60 backdrop-blur-sm flex items-center justify-center p-3 sm:p-6 overflow-y-auto">
              <div onClick={(e) => e.stopPropagation()} className="bg-[#F2F1ED] border-2 border-[#866143] rounded-3xl max-w-5xl w-full max-h-[90vh] overflow-y-auto p-5 sm:p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-4 mb-5 border-b border-[#D5CFC4]">
                  <div>
                    <span className="text-xs font-extrabold text-[#866143]">{activeRef.categoryLabel} · {activeRef.growth} ▲</span>
                    <h2 className="text-lg sm:text-xl font-extrabold text-[#292824]">{activeRef.keyword} (실시간 시장조사 리포트)</h2>
                  </div>
                  <button onClick={() => setActiveRef(null)} className="px-3 py-1.5 rounded-xl bg-[#EAE6DF] border border-[#D5CFC4] text-xs font-bold text-[#292824]">닫기 ✕</button>
                </div>

                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  <div className="lg:col-span-5 space-y-4">
                    <div className="p-4 rounded-2xl bg-[#EAE6DF] border border-[#D5CFC4]">
                      <div className="text-xs font-bold text-[#866143] mb-1">{activeRef.memeTag}</div>
                      <div className="text-base font-extrabold text-[#292824] mb-1">{activeRef.thumbnailTitle}</div>
                      <p className="text-xs text-[#292824]/80 mb-3">{activeRef.thumbnailSub}</p>
                      <div className="text-[11px] font-bold text-[#866143] pt-2 border-t border-[#D5CFC4]">{activeRef.format}</div>
                    </div>
                    <div className="space-y-2">
                      <div className="text-xs font-extrabold text-[#866143]">숏폼 후킹 타임라인 해부</div>
                      {activeRef.hookStructure?.map((h, i) => (
                        <div key={i} className="p-3 rounded-xl bg-[#EAE6DF] border border-[#D5CFC4]">
                          <div className="text-xs font-bold text-[#866143]">{h.step}</div>
                          <div className="text-xs text-[#292824] mt-0.5">{h.desc}</div>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="lg:col-span-7 space-y-4">
                    <div className="grid grid-cols-4 gap-1.5 p-1 bg-[#EAE6DF] rounded-xl border border-[#D5CFC4]">
                      <button onClick={() => setActiveTab('market')} className={`py-2 rounded-lg text-xs font-bold ${activeTab === 'market' ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]'}`}>실시간 랭킹</button>
                      <button onClick={() => setActiveTab('voc')} className={`py-2 rounded-lg text-xs font-bold ${activeTab === 'voc' ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]'}`}>리뷰 빈틈(VOC)</button>
                      <button onClick={() => setActiveTab('ai')} className={`py-2 rounded-lg text-xs font-bold ${activeTab === 'ai' ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]'}`}>AI 대본·카피</button>
                      <button onClick={() => setActiveTab('funnel')} className={`py-2 rounded-lg text-xs font-bold ${activeTab === 'funnel' ? 'bg-[#866143] text-[#F2F1ED]' : 'text-[#292824]'}`}>퍼널 전략</button>
                    </div>

                    {activeTab === 'market' && (
                      <div className="space-y-4">
                        <div className="p-4 rounded-2xl bg-[#EAE6DF] border border-[#D5CFC4] space-y-2">
                          <div className="text-xs font-extrabold text-[#866143] mb-2">{activeRef.platformRankingTitle}</div>
                          {activeRef.rankings?.map((r) => (
                            <div key={r.rank} className="p-3 rounded-xl bg-[#F2F1ED] border border-[#D5CFC4] flex justify-between items-center text-xs">
                              <div>
                                <span className="font-extrabold text-[#866143] mr-2">{r.rank}위</span>
                                <span className="font-bold text-[#292824]">{r.name}</span>
                                <span className="ml-2 text-[11px] text-[#866143]">({r.badge})</span>
                              </div>
                              <span className="font-extrabold shrink-0 ml-2">{r.price}</span>
                            </div>
                          ))}
                        </div>
                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                          {Object.entries(activeRef.channelMetrics || {}).map(([k, v]) => (
                            <div key={k} className="p-3 rounded-xl bg-[#EAE6DF] border border-[#D5CFC4] flex justify-between items-center">
                              <div>
                                <div className="text-xs font-bold text-[#292824]">{v.label}</div>
                                <div className="text-[11px] text-[#292824]/70">{v.sub}</div>
                              </div>
                              <div className="text-right">
                                <div className="text-sm font-extrabold text-[#292824]">{v.value}</div>
                                <div className="text-[11px] font-bold text-[#866143]">{v.growth}</div>
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {activeTab === 'voc' && (
                      <div className="space-y-3">
                        {activeRef.vocPainPoints?.map((v, i) => (
                          <div key={i} className="p-4 rounded-2xl bg-[#EAE6DF] border border-[#D5CFC4]">
                            <div className="flex justify-between text-xs font-bold mb-1">
                              <span>소비자 불만 #{i + 1}</span>
                              <span className="text-[#866143]">언급 비중 {v.ratio}%</span>
                            </div>
                            <p className="text-sm font-extrabold text-[#292824] mb-2">“{v.issue}”</p>
                            <div className="w-full h-2 rounded-full bg-[#F2F1ED] overflow-hidden">
                              <div style={{ width: `${v.ratio}%` }} className="h-full bg-[#866143]" />
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {activeTab === 'ai' && (
                      <div className="space-y-3">
                        <div className="p-4 rounded-2xl bg-[#EAE6DF] border border-[#D5CFC4]">
                          <div className="grid grid-cols-4 gap-1 mb-2">
                            {['naver', 'reels', 'youtube', 'tiktok'].map((ch) => (
                              <button key={ch} onClick={() => setScriptChannelTab(ch)} className={`py-1 rounded text-[11px] font-bold uppercase ${scriptChannelTab === ch ? 'bg-[#866143] text-[#F2F1ED]' : 'bg-[#F2F1ED] text-[#292824]'}`}>{ch}</button>
                            ))}
                          </div>
                          <div className="p-3 rounded-xl bg-[#F2F1ED] text-xs whitespace-pre-line leading-relaxed">{activeRef.channelScripts?.[scriptChannelTab]}</div>
                        </div>
                        {activeRef.aiStrategies?.map((st, i) => (
                          <div key={i} className="p-3.5 rounded-2xl bg-[#EAE6DF] border border-[#D5CFC4] flex justify-between items-center gap-3">
                            <p className="text-xs font-bold text-[#292824]">{st}</p>
                            <button onClick={() => { navigator.clipboard.writeText(st); setCopiedIndex(i); setTimeout(() => setCopiedIndex(null), 1500); }} className="px-2.5 py-1.5 rounded-lg bg-[#F2F1ED] border border-[#D5CFC4] text-xs font-bold shrink-0">
                              {copiedIndex === i ? '복사됨!' : '복사'}
                            </button>
                          </div>
                        ))}
                      </div>
                    )}

                    {activeTab === 'funnel' && (
                      <div className="p-4 rounded-2xl bg-[#EAE6DF] border border-[#866143] text-xs leading-relaxed text-[#292824] font-medium">
                        <div className="font-extrabold text-[#866143] mb-2">크로스 채널 마케팅 퍼널 설계</div>
                        {activeRef.crossChannelFunnel}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
